<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Momentum Phone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0806; --fg: #fdf6ec; --muted: #a8977f;
    --yellow: #fcd34d; --amber: #fbbf24; --orange: #f97316; --deep: #c2410c;
    --amp: 0;                       /* 0..1, set from the live voice level */
    --font: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--fg); font-family: var(--font); overflow: hidden; }
  body { background: radial-gradient(circle at 50% 42%, #1c120a 0%, var(--bg) 60%); }

  .app { height: 100%; max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; align-items: center;
    justify-content: space-between; text-align: center;
    padding: max(48px, env(safe-area-inset-top)) 24px max(40px, env(safe-area-inset-bottom)); }

  .status { font-size: 13px; letter-spacing: .18em; text-transform: uppercase; color: var(--amber); min-height: 18px; }
  .name { font-size: 30px; font-weight: 600; margin-top: 10px; letter-spacing: .02em; }

  /* ---------- the orb ---------- */
  .stage { position: relative; width: 240px; height: 240px; display: grid; place-items: center; }
  .orb { position: relative; width: 180px; height: 180px; border-radius: 50%;
    background: radial-gradient(circle at 38% 32%, var(--yellow) 0%, var(--amber) 35%, var(--orange) 70%, var(--deep) 100%);
    box-shadow: 0 0 calc(50px + var(--amp) * 90px) calc(6px + var(--amp) * 26px) rgba(249, 115, 22, calc(.35 + var(--amp) * .45));
    transform: scale(calc(1 + var(--amp) * .16)); transition: box-shadow .08s linear; }
  .orb::after { content: ""; position: absolute; inset: 18% 22% 50% 22%; border-radius: 50%;
    background: radial-gradient(ellipse, rgba(255,255,255,.35), transparent 70%); filter: blur(4px); }

  /* idle: slow breathe */
  body.idle .orb { animation: breathe 4s ease-in-out infinite; }
  @keyframes breathe { 50% { transform: scale(1.04); } }
  /* talking / listening: the voice drives scale + a small shake */
  body.talk .orb, body.listen .orb { animation: shake .12s linear infinite; }
  @keyframes shake {
    0%   { translate: calc(var(--amp) * -3px) 0; }
    25%  { translate: 0 calc(var(--amp) * 3px); }
    50%  { translate: calc(var(--amp) * 3px) 0; }
    75%  { translate: 0 calc(var(--amp) * -3px); }
    100% { translate: calc(var(--amp) * -3px) 0; }
  }
  body.listen .orb { background: radial-gradient(circle at 38% 32%, #fff7cc 0%, var(--yellow) 40%, var(--amber) 80%, var(--orange) 100%); }
  /* ringing: ripples */
  .ripple { position: absolute; inset: 30px; border-radius: 50%; border: 2px solid var(--amber); opacity: 0; pointer-events: none; }
  body.ring .ripple { animation: ripple 2s ease-out infinite; }
  body.ring .ripple:nth-child(2) { animation-delay: .66s; }
  body.ring .ripple:nth-child(3) { animation-delay: 1.33s; }
  @keyframes ripple { 0% { transform: scale(.9); opacity: .7; } 100% { transform: scale(1.6); opacity: 0; } }
  body.ring .orb { animation: ringpulse 1s ease-in-out infinite; }
  @keyframes ringpulse { 50% { transform: scale(1.07); } }
  body.missed .orb { filter: grayscale(.6) brightness(.6); }

  .caption { font-size: 18px; line-height: 1.5; min-height: 84px; max-width: 380px; color: var(--fg); white-space: pre-line; }
  .hint { font-size: 13px; color: var(--muted); margin-top: 10px; min-height: 18px; }

  /* ---------- buttons ---------- */
  .row { display: flex; gap: 72px; justify-content: center; }
  .btn { width: 74px; height: 74px; border-radius: 50%; font-size: 28px; cursor: pointer; display: grid; place-items: center;
    transition: transform .12s; }
  .btn:active { transform: scale(.94); }
  .accept { background: linear-gradient(135deg, var(--amber), var(--orange)); border: 0; color: #2a1405;
    box-shadow: 0 0 26px rgba(249,115,22,.55); }
  .decline, .end { background: transparent; border: 2px solid #6b4a2e; color: #f4c9a0; }
  .label { font-size: 12px; color: var(--muted); margin-top: 10px; letter-spacing: .08em; }
  .primary { background: linear-gradient(135deg, var(--amber), var(--orange)); color: #2a1405; border: 0; border-radius: 999px;
    padding: 16px 34px; font: 600 16px var(--font); cursor: pointer; box-shadow: 0 0 30px rgba(249,115,22,.45); }
  .ghost { background: transparent; color: var(--amber); border: 1px solid #6b4a2e; border-radius: 999px;
    padding: 11px 20px; font: 500 14px var(--font); cursor: pointer; }
  .answer { display: flex; flex-direction: column; align-items: center; gap: 12px; min-height: 48px; }
  .answer .row { gap: 12px; }

  .screen { display: none; flex-direction: column; align-items: center; gap: 18px; }
  .screen.on { display: flex; }
</style>
</head>
<body class="idle">
<div class="app">
  <div>
    <p class="status" id="status"></p>
    <h1 class="name" id="title">Momentum</h1>
  </div>

  <div class="stage">
    <span class="ripple"></span><span class="ripple"></span><span class="ripple"></span>
    <div class="orb" id="orb"></div>
  </div>

  <div style="width:100%">
    <!-- start -->
    <section id="s-start" class="screen on">
      <button class="primary" id="enable">Turn on</button>
      <p class="hint">Keep this page open. Momentum will call you.</p>
    </section>
    <!-- waiting -->
    <section id="s-idle" class="screen">
      <p class="hint" id="idle-sub">Waiting for the right moment…</p>
    </section>
    <!-- ringing -->
    <section id="s-ring" class="screen">
      <div class="row">
        <div><button class="btn decline" id="decline" aria-label="Decline">✕</button><p class="label">Decline</p></div>
        <div><button class="btn accept" id="accept" aria-label="Accept">✆</button><p class="label">Accept</p></div>
      </div>
    </section>
    <!-- on the call -->
    <section id="s-call" class="screen">
      <p class="caption" id="caption"></p>
      <div class="answer" id="answer-area"></div>
      <div><button class="btn end" id="hangup" aria-label="End call">✕</button><p class="label" id="timer">00:00</p></div>
    </section>
    <!-- missed -->
    <section id="s-missed" class="screen">
      <p class="caption" id="vm-text" style="min-height:0"></p>
      <button class="ghost" id="vm-play">▶ Play voicemail</button>
    </section>
  </div>
</div>

<script>
const K = new URLSearchParams(location.search).get("k") || "";
const api = (p, opt) => fetch(p + (p.includes("?") ? "&" : "?") + "k=" + encodeURIComponent(K), opt).then(r => r.json());
const $ = id => document.getElementById(id);
const MODE = { "s-start": "idle", "s-idle": "idle", "s-ring": "ring", "s-call": "talk", "s-missed": "missed" };
const STATUS = { "s-start": "", "s-idle": "Ready", "s-ring": "Incoming call", "s-call": "On call", "s-missed": "Missed call" };
function setMode(m) { document.body.className = m; }
function show(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("on")); $(id).classList.add("on");
  setMode(MODE[id]); $("status").textContent = STATUS[id];
}

let ctx, analyser, micAnalyser, ringTimer, ringStop, current = null, callStart = 0, clock, recorder, chunks = [];
let speakingFallback = false;
const RING_SECONDS = 20;

// ---------- the orb follows the live voice level ----------
const bins = new Uint8Array(128);
let smooth = 0;
function loop(t) {
  const mode = document.body.className;
  let level = 0;
  const an = mode === "listen" ? micAnalyser : (mode === "talk" || mode === "ring") ? analyser : null;
  if (an) {
    an.getByteFrequencyData(bins);
    let sum = 0; for (let i = 2; i < 48; i++) sum += bins[i];
    level = Math.min(1, (sum / 46) / 150);
  }
  if (mode === "talk" && speakingFallback && level < .05) {   // browser fallback voice gives no audio data
    level = .35 + .25 * Math.sin(t / 90) * Math.sin(t / 230);
  }
  smooth += (level - smooth) * .35;
  document.documentElement.style.setProperty("--amp", smooth.toFixed(3));
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ---------- ringtone (WebAudio, no files) ----------
function ringOnce() {
  if (!ctx) return;
  const gn = ctx.createGain(); gn.gain.value = 0.15; gn.connect(analyser);
  [440, 480].forEach(f => { const o = ctx.createOscillator(); o.frequency.value = f; o.connect(gn); o.start(); o.stop(ctx.currentTime + 2); });
  if (navigator.vibrate) navigator.vibrate([800, 300, 800]);
}
function startRinging() { ringOnce(); ringTimer = setInterval(ringOnce, 4000); ringStop = setTimeout(missed, RING_SECONDS * 1000); }
function stopRinging() { clearInterval(ringTimer); clearTimeout(ringStop); if (navigator.vibrate) navigator.vibrate(0); }

// ---------- natural voice: AssemblyAI TTS through the analyser ----------
const SPEECH_RATE = 0.88;  // slower and calmer; the audio element keeps her natural pitch
const ttsCache = {};
function fetchVoice(text) {
  if (!ttsCache[text]) {
    ttsCache[text] = fetch("/phone/api/tts?k=" + encodeURIComponent(K), post({ text }))
      .then(r => r.status === 200 ? r.blob() : null)
      .then(b => b ? URL.createObjectURL(b) : null)
      .catch(() => null);
  }
  return ttsCache[text];
}
// one <audio> element, routed through the analyser so the orb still reacts to the voice
const voiceEl = new Audio();
voiceEl.preservesPitch = true; voiceEl.mozPreservesPitch = true; voiceEl.webkitPreservesPitch = true;
let voiceRouted = false;
async function say(text) {
  const url = ctx ? await fetchVoice(text) : null;
  if (url) {
    if (!voiceRouted) { ctx.createMediaElementSource(voiceEl).connect(analyser); voiceRouted = true; }
    return new Promise(res => {
      voiceEl.onended = voiceEl.onerror = () => res();
      voiceEl.src = url; voiceEl.playbackRate = SPEECH_RATE;
      voiceEl.play().catch(() => res());
    });
  }
  return browserSay(text);
}
function stopSpeaking() { try { voiceEl.pause(); } catch (e) {} speechSynthesis.cancel(); speakingFallback = false; }
function browserSay(text) {
  return new Promise(res => {
    if (!("speechSynthesis" in window)) return res();
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text); u.rate = 0.9; u.pitch = 1.0;
    const v = speechSynthesis.getVoices().find(v => /en(-|_)US/i.test(v.lang) && /female|samantha|zira|google us/i.test(v.name))
           || speechSynthesis.getVoices().find(v => /^en/i.test(v.lang));
    if (v) u.voice = v;
    const done = () => { clearTimeout(t); speakingFallback = false; res(); };   // some browsers never fire onend
    const t = setTimeout(done, 1500 + text.split(/\s+/).length * 450);
    u.onend = done; u.onerror = done; speakingFallback = text.trim().length > 0; speechSynthesis.speak(u);
  });
}

$("enable").onclick = async () => {
  ctx = new (window.AudioContext || window.webkitAudioContext)(); await ctx.resume();
  analyser = ctx.createAnalyser(); analyser.fftSize = 256; analyser.smoothingTimeConstant = 0.6; analyser.connect(ctx.destination);
  browserSay(" ");
  try { (await navigator.mediaDevices.getUserMedia({ audio: true })).getTracks().forEach(t => t.stop()); } catch (e) {}
  show("s-idle"); poll();
};

async function poll() {
  if (!current) {
    try {
      const r = await api("/phone/api/next");
      if (r.call) { current = r.call; fetchVoice(current.greeting); show("s-ring"); startRinging(); }
    } catch (e) { $("idle-sub").textContent = "Reconnecting…"; }
  }
  setTimeout(poll, 3000);
}

$("decline").onclick = async () => {
  stopRinging(); const r = await api("/phone/api/end", post({ id: current.id, how: "declined" }));
  current = null; show("s-idle"); $("idle-sub").textContent = r.note || "Declined. I'll try again later.";
};

async function missed() {
  stopRinging(); const r = await api("/phone/api/end", post({ id: current.id, how: "missed" }));
  $("vm-text").textContent = r.voicemail; show("s-missed"); current = null;
}
$("vm-play").onclick = async () => { setMode("talk"); await say($("vm-text").textContent); setMode("missed"); };

$("accept").onclick = async () => {
  stopRinging(); show("s-call"); callStart = Date.now();
  clock = setInterval(() => { const s = Math.floor((Date.now() - callStart) / 1000);
    $("timer").textContent = String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); }, 500);
  $("caption").textContent = current.greeting;
  await say(current.greeting);
  listen();
};

function post(obj) { return { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(obj) }; }

async function listen() {
  const area = $("answer-area");
  const tapButtons = `<div class="row"><button class="ghost" id="t-yes">I started</button><button class="ghost" id="t-no">Not now</button></div>`;
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); } catch (e) { stream = null; }
  if (!current.voice || !stream || !window.MediaRecorder) { area.innerHTML = tapButtons; wireTaps(); return; }
  setMode("listen"); $("status").textContent = "Listening";
  try { const ms = ctx.createMediaStreamSource(stream); micAnalyser = ctx.createAnalyser(); micAnalyser.fftSize = 256; ms.connect(micAnalyser); } catch (e) {}
  chunks = []; recorder = new MediaRecorder(stream);
  recorder.ondataavailable = e => chunks.push(e.data);
  const stopMic = () => { stream.getTracks().forEach(t => t.stop()); micAnalyser = null; setMode("talk"); $("status").textContent = "On call"; };
  recorder.onstop = async () => {
    stopMic(); area.innerHTML = '<p class="hint">…</p>';
    const blob = new Blob(chunks, { type: recorder.mimeType || "audio/webm" });
    const r = await fetch("/phone/api/answer?id=" + current.id + "&k=" + encodeURIComponent(K),
      { method: "POST", headers: { "Content-Type": blob.type }, body: blob }).then(r => r.json());
    finish(r);
  };
  recorder.start();
  area.innerHTML = `<button class="ghost" id="done">Done talking</button>`;
  $("done").onclick = () => recorder.state === "recording" && recorder.stop();
  setTimeout(() => recorder.state === "recording" && recorder.stop(), 7000);
}

function wireTaps() {
  const send = async said => { $("answer-area").innerHTML = '<p class="hint">…</p>';
    finish(await api("/phone/api/answer?id=" + current.id, post({ text: said }))); };
  $("t-yes").onclick = () => send("I started");
  $("t-no").onclick = () => send("not now");
}

async function finish(r) {
  setMode("talk");
  $("caption").textContent = (r.heard ? "“" + r.heard + "”\n\n" : "") + r.say;
  $("answer-area").innerHTML = "";
  await say(r.say);
  endCall("Call ended. " + (r.note || ""));
}

$("hangup").onclick = () => { stopSpeaking(); if (current) api("/phone/api/end", post({ id: current.id, how: "hung_up" })); endCall("Call ended."); };
function endCall(msg) { clearInterval(clock); current = null; setTimeout(() => { show("s-idle"); $("idle-sub").textContent = msg; }, 1500); }
</script>
</body>
</html>
